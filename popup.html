<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Importar partido en directo</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Importar partido</h1>
    <p id="page-status" role="status">Comprobando partido...</p>
    <form id="import-form">
      <label for="season">Temporada</label>
      <input id="season" name="temporada" list="seasons" autocomplete="off" required>
      <datalist id="seasons"></datalist>

      <label for="category">Categoría</label>
      <input id="category" name="categoria" list="categories" autocomplete="off" required>
      <datalist id="categories"></datalist>

      <label for="competition">Competición</label>
      <input id="competition" name="competicion" list="competitions" autocomplete="off" required>
      <datalist id="competitions"></datalist>

      <label for="matchday">Jornada</label>
      <input id="matchday" name="jornada" list="matchdays" type="number" min="1" step="1" required>
      <datalist id="matchdays"></datalist>

      <label for="interval">Intervalo de actualización (segundos)</label>
      <input id="interval" name="intervalo" type="number" min="5" max="60" step="1" value="5" required>

      <p id="error" class="error" role="alert" hidden></p>
      <p id="last-result" class="last-result" hidden></p>
      <button id="start" type="submit">Iniciar importación</button>
      <button id="stop" type="button" class="stop" hidden>Detener importación</button>
    </form>
  </main>
  <script src="popup.js"></script>
</body>
</html>
